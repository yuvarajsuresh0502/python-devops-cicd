
name: Python DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Python application
        run: |
          python app.py > app.log 2>&1 &
          for i in {1..10}; do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          cat app.log
          exit 1

      - name: Run automated tests
        run: python -m unittest -v test_app.py

    
      - name: Build Docker image
        run: docker build -t python-devops-cicd .

